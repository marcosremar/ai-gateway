[package]
name = "ai-gateway-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Typed async Rust client of the ai-gateway HTTP API (serve.ts): OpenAI-compatible STT / chat / TTS, speech-to-speech, rooms, deployments, apps, activation and health."
readme = "README.md"
publish = false

# Standalone crate: never picked up by a parent workspace.
[workspace]

[lib]
name = "ai_gateway_sdk"
path = "src/lib.rs"

[dependencies]
# rustls only (no OpenSSL): builds with the GNU toolchain on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
