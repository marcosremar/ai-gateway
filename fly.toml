app = 'parle-gateway-loadtest'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '4000'
  CORS_ORIGINS = '*'
  RATE_LIMIT_RPM = '6000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 100

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'
