app = 'parle-ai-gateway'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '4000'
  CORS_ORIGINS = '*'
  RATE_LIMIT_RPM = '6000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 4000
  force_https = true
  # Keep one machine warm at all times. Eliminates the 2s cold-start that
  # breached healthP99Ms=100ms SLO by 20×. Cost delta: ~$2-3/month for a
  # shared-cpu-2x kept running. See docs/improvement-plan.md P1-2.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 100

  [[http_service.checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'
