version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "gateway.main"]
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - snapshots:/var/snapgpu/snapshots
    environment:
      - SNAPGPU_DB_URL=sqlite:///data/snapgpu.db
      - SNAPGPU_PORT=8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  snapshots:
