name: 'Local Development Docker Compose'

# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f gateway
#
# Starts the gateway server + Redis for state persistence.
# Requires .env file with API keys.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-4000}:4000'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=4000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./serve.ts:/app/serve.ts:ro
      - ai-gateway-config:/root/.ai-gateway
    command: ['bun', 'run', 'serve.ts']

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  ai-gateway-config:
