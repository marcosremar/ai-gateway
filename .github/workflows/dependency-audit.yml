name: Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'pyproject.toml'
  schedule:
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for critical CVEs
        run: |
          AUDIT_OUTPUT=$(bun audit 2>&1 || true)
          CRITICAL=$(echo "$AUDIT_OUTPUT" | grep -c "critical" || true)
          HIGH=$(echo "$AUDIT_OUTPUT" | grep -c "high" || true)
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical vulnerability(ies). Run 'bun audit' locally for details."
            exit 1
          else
            echo "✅ No critical vulnerabilities found"
          fi
