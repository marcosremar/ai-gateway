name: Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'pyproject.toml'
  schedule:
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit
        run: bun audit --json || true
        continue-on-error: true

      - name: Check for critical CVEs
        run: |
          AUDIT_OUTPUT=$(bun audit 2>&1 || true)
          CRITICAL=$(echo "$AUDIT_OUTPUT" | grep -c "critical" || true)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::warning::Found $CRITICAL critical vulnerability(ies). Run 'bun audit' locally for details."
          else
            echo "✅ No critical vulnerabilities found"
          fi
