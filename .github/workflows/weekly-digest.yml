name: Weekly Telemetry Digest

# Runs every Monday at 08:00 UTC. Also manually triggerable.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run telemetry digest
        run: bun run insights:digest
        env:
          # The digest reads from ~/.babelcast/ which won't exist in CI.
          # It handles missing files gracefully (0 findings, 0 events).
          # In the future, we'll pull telemetry from a remote store.
          HOME: /home/runner

      - name: Commit digest if new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/insights/; then
            echo "No new digest generated (no telemetry data in CI)"
          else
            git add docs/insights/
            git commit -m "docs: weekly telemetry digest $(date +%Y-%m-%d)"
            git push
          fi
