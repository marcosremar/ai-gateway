name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag (optional, defaults to latest commit)'
        required: false
        type: string

  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # ── Pre-deploy Checks ─────────────────────────────────────────────────────
  pre-deploy:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        env:
          SKIP_GPU_TESTS: '1'
          SKIP_LIVE_TESTS: '1'
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Environment validation
        run: bash scripts/validate-env.sh .env.example

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            printf 'version=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -n "$REF_NAME" ] && [[ "$REF_NAME" == v* ]]; then
            printf 'version=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%s\n' "$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy to Staging ─────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: pre-deploy
    if: github.event.inputs.environment == 'staging' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://ai-gateway-staging.fly.dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly.io (staging)
        run: |
          flyctl deploy \
            --app ai-gateway-staging \
            --dockerfile Dockerfile.production \
            --remote-only \
            --wait-timeout 300 \
            --build-arg VERSION=${{ needs.pre-deploy.outputs.version }}

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          curl -f --retry 5 --retry-delay 10 --retry-connrefused \
            https://ai-gateway-staging.fly.dev/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✓ Staging deployment successful"
          echo "Version: ${{ needs.pre-deploy.outputs.version }}"
          echo "URL: https://ai-gateway-staging.fly.dev/health"

  # ── Deploy to Production (requires approval) ──────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: pre-deploy
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://parle-ai-gateway.fly.dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly.io (production)
        run: |
          flyctl deploy \
            --app parle-ai-gateway \
            --dockerfile Dockerfile.production \
            --remote-only \
            --wait-timeout 300 \
            --build-arg VERSION=${{ needs.pre-deploy.outputs.version }}

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          curl -f --retry 5 --retry-delay 10 --retry-connrefused \
            https://parle-ai-gateway.fly.dev/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✓ Production deployment successful"
          echo "Version: ${{ needs.pre-deploy.outputs.version }}"
          echo "URL: https://parle-ai-gateway.fly.dev/health"

  # ── Post-deploy Smoke Tests ───────────────────────────────────────────────
  post-deploy-tests:
    name: Post-deploy Smoke Tests
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run smoke tests
        env:
          BASE_URL: ${{ needs.deploy-production.result == 'success' && 'https://parle-ai-gateway.fly.dev' || 'https://ai-gateway-staging.fly.dev' }}
        run: |
          echo "Running post-deploy smoke tests against $BASE_URL"
          bun run vitest run __tests__/smoke/ --reporter=verbose || echo "Smoke tests failed - check logs"
