name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel stale PR runs when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fail fast if the lockfile is drifted. `--frozen-lockfile` refuses to
      # install if any package.json dep is newer than what's locked.
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Unit tier only — fast subset (<90s) that every PR can afford to block on.
      # Integration / live / benchmark / soak tiers run via the nightly workflow.
      - name: Unit tests
        env:
          SKIP_GPU_TESTS: '1'
          SKIP_LIVE_TESTS: '1'
        run: bun run test:unit

      - name: Integration smoke tests
        env:
          SKIP_GPU_TESTS: '1'
          SKIP_LIVE_TESTS: '1'
        run: bun run vitest run __tests__/integration/ --reporter=verbose || true

      - name: Build (library bundle)
        run: bun run build

      - name: Check dependency vulnerabilities
        run: |
          AUDIT_OUTPUT=$(bun audit 2>&1 || true)
          CRITICAL=$(echo "$AUDIT_OUTPUT" | grep -c "critical" || true)
          HIGH=$(echo "$AUDIT_OUTPUT" | grep -c "high" || true)
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::warning::Found $CRITICAL critical vulnerability(ies)"
          fi
          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::Found $HIGH high vulnerability(ies)"
          fi

      # Library/service boundary guard — src/ must never import from server/.
      # See docs/architecture/lib-vs-service.md.
      - name: Lib/service boundary check
        run: |
          if grep -rn --include='*.ts' -E "from ['\"]\\.\\./\\.\\./server/|from ['\"]\\.\\./server/" src/ 2>/dev/null; then
            echo "::error::src/ must not import from server/. See docs/architecture/lib-vs-service.md"
            exit 1
          fi
          echo "Lib/service boundary is clean"
