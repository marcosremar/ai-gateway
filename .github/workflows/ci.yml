name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel stale PR runs when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Shard 1: Typecheck + Lint ───────────────────────────────────────────
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: AI quality fitness gate
        run: bun run quality:fitness

  # ── Shard 2: Unit Tests ─────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Unit tests
        env:
          SKIP_GPU_TESTS: '1'
          SKIP_LIVE_TESTS: '1'
        run: bun run test:unit

  # ── Shard 3: Integration Tests ──────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Integration smoke tests
        env:
          SKIP_GPU_TESTS: '1'
          SKIP_LIVE_TESTS: '1'
        run: bun run vitest run __tests__/integration/ --reporter=verbose

  # ── Shard 4: Build ──────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Build (library bundle)
        run: bun run build

  # ── Shard 5: Lib/Service Boundary ───────────────────────────────────────
  boundary:
    name: Lib/Service Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - name: Check boundary
        run: |
          if grep -rn --include='*.ts' -E "from ['\"]\\.\\./\\.\\./server/|from ['\"]\\.\\./server/" src/ 2>/dev/null; then
            echo "::error::src/ must not import from server/. See docs/architecture/lib-vs-service.md"
            exit 1
          fi
          echo "Lib/service boundary is clean"

  # ── Shard 6: Bundle Size Budget ─────────────────────────────────────────
  bundle-budget:
    name: Bundle Size Budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Bundle size ratchet (every entry, raw + gzip, vs quality-bundle-baseline.json)
        # scripts/bundle-size.ts: fails when an entry grows past the tolerance or a new entry has no baseline.
        # Shrinking: `bun run quality:bundle:update`; deliberate growth: `-- --accept-growth "<why>"`.
        run: bun run quality:bundle

  # ── Shard 7: Dependency Audit ───────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Check dependency vulnerabilities
        run: |
          AUDIT_OUTPUT=$(bun audit 2>&1 || true)
          CRITICAL=$(echo "$AUDIT_OUTPUT" | grep -c "critical" || true)
          HIGH=$(echo "$AUDIT_OUTPUT" | grep -c "high" || true)
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical vulnerability(ies) — must fix before merging"
            exit 1
          fi
          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::Found $HIGH high vulnerability(ies)"
          fi
