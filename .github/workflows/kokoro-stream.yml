name: kokoro-stream image

# The speech server next to the gateway (docker/kokoro-stream: Kokoro + Pocket TTS). Pull requests build it (the
# Dockerfile, the pip pins and the Pocket bake are checked without pushing); main and manual runs also push
# ghcr.io/<owner>/kokoro-stream:<UTC date-time>. Railway can instead build it from the repo
# (docker/kokoro-stream/railway.json) — docs/rooms.md § "Own speech server".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (default UTC date-time)
        required: false
  push:
    branches: [main]
    paths:
      - 'docker/kokoro-stream/**'
      - '!docker/kokoro-stream/test_*.py'
      - '!docker/kokoro-stream/evaluate.py'
      - '!docker/kokoro-stream/export.py'
      - '!docker/kokoro-stream/training/**'
      - '.github/workflows/kokoro-stream.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/kokoro-stream/**'
      - '!docker/kokoro-stream/test_*.py'
      - '!docker/kokoro-stream/evaluate.py'
      - '!docker/kokoro-stream/export.py'
      - '!docker/kokoro-stream/training/**'
      - '.github/workflows/kokoro-stream.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: kokoro-stream-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve tag
        id: meta
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "tag=${TAG:-$(date -u +%Y%m%d-%H%M)}" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          sha256sum docker/kokoro-stream/Dockerfile docker/kokoro-stream/requirements*.txt docker/kokoro-stream/*.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: docker/kokoro-stream
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/kokoro-stream:${{ steps.meta.outputs.tag }}

      - name: The image imports Pocket and finds the baked weights offline
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --network none -e HF_HUB_OFFLINE=1 -e POCKET_THREADS=2 \
            ghcr.io/${{ github.repository_owner }}/kokoro-stream:${{ steps.meta.outputs.tag }} \
            python -X utf8 -c "import pocket; p = pocket.Pocket.from_env({'POCKET_TTS': '1'}); m = pocket.load_language('pt', 2, False); s = m.get_state_for_audio_prompt('rafael'); n = sum(len(c) for c in m.generate_audio_stream(s, 'Bom dia.')); print('pocket pt samples', n); assert n > 4800"
