name: aigw-edge image

# Builds docker/aigw-edge and pushes ghcr.io/marcosremar/aigw-edge:<tag>.
# Default tag is the commit's short sha; dispatch with `tag` to republish under a name.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (default short sha)
        required: false
  push:
    branches: [main]
    paths:
      - 'docker/aigw-edge/**'
      - '.github/workflows/aigw-edge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/aigw-edge/**'
      - '.github/workflows/aigw-edge.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve tag
        id: meta
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            sha="${{ github.event.pull_request.head.sha || github.sha }}"
            tag="${sha:0:8}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: docker/aigw-edge
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aigw-edge:${{ steps.meta.outputs.tag }}
