name: Docker Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'dockers/**/Dockerfile*'
  push:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'dockers/**/Dockerfile*'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # Scan main project Dockerfiles
  trivy-main:
    name: Trivy Scan - Main (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
          - Dockerfile.production
          - Dockerfile.worker
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Docker image (${{ matrix.dockerfile }})
        # Image names must be lowercase; the matrix value is a file name (Dockerfile.production), so tag by job index.
        run: docker build -t ai-gateway-scan-${{ strategy.job-index }}:scan -f ${{ matrix.dockerfile }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'ai-gateway-scan-${{ strategy.job-index }}:scan'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.dockerfile }}.sarif'
          severity: 'CRITICAL,HIGH'
          # Without this, SARIF output scans (and fails on) every severity and ignores `severity` above.
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.dockerfile }}.sarif'

  # Scan dockers/ subproject images (only on schedule or if changed)
  trivy-subprojects:
    name: Trivy Scan - Subprojects (${{ matrix.subproject }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'push'
    strategy:
      matrix:
        subproject:
          - babelcast-subtitle
          - dit360
          - hamer
          - hy-motion
          - hybrik-x
          - kokoro-tts
          - lam
          - parle-gateway
          - snapgpu-runtime
          - trellis2
          - ultravox-s2s
          - wilor
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Docker image (${{ matrix.subproject }})
        run: docker build -t ai-gateway-${{ matrix.subproject }}:scan -f dockers/${{ matrix.subproject }}/Dockerfile dockers/${{ matrix.subproject }}/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'ai-gateway-${{ matrix.subproject }}:scan'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.subproject }}.sarif'
          severity: 'CRITICAL,HIGH'
          # Without this, SARIF output scans (and fails on) every severity and ignores `severity` above.
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.subproject }}.sarif'
