name: 'Dependabot Config'

version: 2
updates:
  # TypeScript/JavaScript dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    reviewers:
      - 'marcosremar'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Group patch updates together
    groups:
      dev-dependencies:
        patterns:
          - '@types/*'
          - 'vitest'
          - 'tsup'
          - 'typescript'
          - 'eslint*'
          - 'prettier'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@types/*'
          - 'vitest'
          - 'tsup'
          - 'typescript'
        update-types:
          - 'patch'

  # Python dependencies (snapgpu)
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    reviewers:
      - 'marcosremar'
    labels:
      - 'dependencies'
      - 'python'
      - 'automated'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Paris'
    reviewers:
      - 'marcosremar'
    labels:
      - 'ci'
      - 'automated'
    commit-message:
      prefix: 'ci'
      include: 'scope'

  # Docker dependencies
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Paris'
    reviewers:
      - 'marcosremar'
    labels:
      - 'docker'
      - 'automated'
