name: 'Bug Report'
description: 'Report a bug in AI Gateway'
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which part of the system is affected?
      options:
        - Proxy Server (/v1/* endpoints)
        - AI Providers (STT/LLM/TTS)
        - GPU Autoscaler
        - Speech Pipeline
        - Client SDK
        - CLI
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I call /v1/speech with ..., the response is ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start the gateway with `bun run serve.ts`
        2. Call POST /v1/speech with audio.wav
        3. See error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Gateway Version
      description: What version are you running?
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Runtime
      description: Bun/Node.js version
      placeholder: 'bun 1.x / node 20.x'
  - type: dropdown
    id: providers
    attributes:
      label: Affected Provider(s)
      multiple: true
      options:
        - Groq
        - OpenAI
        - Fireworks
        - OpenRouter
        - Modal
        - RunPod
        - Vast.ai
        - TensorDock
        - Not applicable
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error messages or logs. Please redact API keys.
      render: shell
